<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="chilliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3333" />
      <stop offset="60%" stop-color="#cc0000" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#66bb22" />
      <stop offset="100%" stop-color="#2d7711" />
    </linearGradient>
    <linearGradient id="highlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Chilli Body -->
    <path d="M 68 70 C 85 45, 135 48, 175 80 C 215 112, 230 170, 205 205 C 185 230, 160 215, 145 190 C 130 165, 110 135, 68 110 C 50 100, 52 85, 68 70 Z" 
          fill="url(#chilliGrad)" stroke="#660000" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Highlight Reflection -->
    <path d="M 85 75 C 110 60, 150 75, 180 100 C 195 115, 195 140, 175 140 C 155 140, 125 110, 85 75 Z" 
          fill="url(#highlight)" />

    <!-- Stem Base / Calyx -->
    <path d="M 60 75 C 65 65, 75 60, 85 62 C 90 70, 88 80, 82 86 C 75 90, 65 92, 58 84 Z" 
          fill="url(#stemGrad)" stroke="#1a4d0a" stroke-width="3"/>
    <path d="M 72 65 C 68 50, 60 35, 45 30 C 40 28, 38 32, 42 38 C 50 48, 55 58, 62 70 Z" 
          fill="url(#stemGrad)" stroke="#1a4d0a" stroke-width="2"/>
    
    <!-- Spark / Spice accents -->
    <circle cx="215" cy="180" r="4" fill="#ffcc00" />
    <circle cx="225" cy="165" r="3" fill="#ff9900" />
    <path d="M 220 150 Q 228 145 225 138" stroke="#ff4400" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>