<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="50%" stop-color="#1c5ca8" />
      <stop offset="100%" stop-color="#0e3362" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f2f4f8" />
      <stop offset="100%" stop-color="#d6dde6" />
    </linearGradient>
    <filter id="riceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#riceShadow)">
    <!-- Steam wisps -->
    <path d="M 90 75 Q 82 50 95 30" stroke="#b0c4de" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 128 70 Q 138 45 125 25" stroke="#b0c4de" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M 165 75 Q 155 50 168 30" stroke="#b0c4de" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>

    <!-- Mound of Rice -->
    <ellipse cx="128" cy="115" rx="86" ry="45" fill="url(#riceGrad)" stroke="#b8c2cc" stroke-width="2"/>
    <path d="M 45 120 Q 80 75 128 75 Q 176 75 211 120 Z" fill="url(#riceGrad)"/>
    
    <!-- Rice grain texture details -->
    <ellipse cx="110" cy="90" rx="6" ry="2.5" fill="#e2e8f0" transform="rotate(-15 110 90)"/>
    <ellipse cx="135" cy="85" rx="7" ry="3" fill="#ffffff" transform="rotate(25 135 85)"/>
    <ellipse cx="150" cy="100" rx="6" ry="2.5" fill="#edf2f7" transform="rotate(-30 150 100)"/>
    <ellipse cx="100" cy="105" rx="6.5" ry="3" fill="#ffffff" transform="rotate(10 100 105)"/>
    <ellipse cx="125" cy="102" rx="7" ry="2.5" fill="#f7fafc" transform="rotate(5 125 102)"/>
    <ellipse cx="80" cy="112" rx="5" ry="2" fill="#e2e8f0" transform="rotate(40 80 112)"/>
    <ellipse cx="170" cy="108" rx="6" ry="2.5" fill="#edf2f7" transform="rotate(-20 170 108)"/>

    <!-- Bowl Rim & Body -->
    <path d="M 32 118 Q 128 135 224 118 C 220 185 180 220 128 220 C 76 220 36 185 32 118 Z" 
          fill="url(#bowlGrad)" stroke="#092040" stroke-width="4"/>
    
    <!-- Decorative Bowl Band -->
    <path d="M 42 145 Q 128 160 214 145" stroke="#f6c23e" stroke-width="5" fill="none"/>
    <ellipse cx="128" cy="216" rx="42" ry="7" fill="#0b2447"/>
  </g>
</svg>