<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bunTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e09f3e" />
      <stop offset="60%" stop-color="#bc6c25" />
      <stop offset="100%" stop-color="#99582a" />
    </linearGradient>
    <linearGradient id="vadaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="60%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#b05200" />
    </linearGradient>
    <linearGradient id="bunBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ddb892" />
      <stop offset="100%" stop-color="#a67c52" />
    </linearGradient>
    <filter id="vpShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#vpShadow)">
    <!-- Bottom Bun -->
    <path d="M 40 165 C 40 185 60 205 128 205 C 196 205 216 185 216 165 Z" 
          fill="url(#bunBottom)" stroke="#6f4e37" stroke-width="3"/>
    
    <!-- Red Chilli / Garlic Masala powder crumbs -->
    <ellipse cx="128" cy="166" rx="80" ry="10" fill="#c1121f" opacity="0.85"/>
    <circle cx="70" cy="168" r="2.5" fill="#780000"/>
    <circle cx="185" cy="167" r="2.5" fill="#780000"/>

    <!-- Golden Vada (Potato Dumpling) -->
    <ellipse cx="128" cy="148" rx="72" ry="32" fill="url(#vadaGrad)" stroke="#873e23" stroke-width="3"/>
    <!-- Crispy Besan batter texture dots -->
    <circle cx="100" cy="145" r="3" fill="#ffe6a7" opacity="0.8"/>
    <circle cx="145" cy="142" r="3.5" fill="#ffe6a7" opacity="0.8"/>
    <circle cx="125" cy="155" r="3" fill="#e07a5f"/>

    <!-- Green Fried Chilli tucked in -->
    <path d="M 160 145 Q 195 135 220 148 Q 200 155 170 152 Z" fill="#588157" stroke="#344e41" stroke-width="2"/>
    <path d="M 220 148 Q 232 150 238 145" stroke="#344e41" stroke-width="2.5" fill="none"/>

    <!-- Top Pav Bun -->
    <path d="M 42 140 C 38 95 65 60 128 60 C 191 60 218 95 214 140 C 195 145 65 145 42 140 Z" 
          fill="url(#bunTop)" stroke="#58311a" stroke-width="3.5"/>
    
    <!-- Bun Glaze Highlight -->
    <path d="M 65 85 C 85 70 145 70 180 82 C 160 88 95 88 65 85 Z" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>