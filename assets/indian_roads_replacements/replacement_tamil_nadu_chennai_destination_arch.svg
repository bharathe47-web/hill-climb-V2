<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <filter id="aShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="saffron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <g filter="url(#aShadow)">
    <!-- Pylons / Columns -->
    <rect x="80" y="120" width="60" height="350" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="4"/>
    <rect x="660" y="120" width="60" height="350" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="4"/>
    <rect x="60" y="440" width="100" height="30" rx="4" fill="#1e293b"/>
    <rect x="640" y="440" width="100" height="30" rx="4" fill="#1e293b"/>
    <!-- Overhead Gantry Truss -->
    <rect x="60" y="70" width="680" height="100" rx="16" fill="#0f172a" stroke="url(#gold)" stroke-width="6"/>
    <!-- Indian Tricolor Ribbon Stripes -->
    <rect x="80" y="80" width="640" height="24" fill="url(#saffron)"/>
    <rect x="80" y="104" width="640" height="24" fill="#ffffff"/>
    <rect x="80" y="128" width="640" height="24" fill="#138808"/>
    <!-- Ashok Chakra Emblem in Center -->
    <circle cx="400" cy="116" r="10" fill="none" stroke="#000080" stroke-width="2"/>
    <!-- Destination Victory Text -->
    <text x="400" y="50" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="#fef08a" text-anchor="middle">★ DESTINATION FINISH ★</text>
    <text x="400" y="125" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#000080" text-anchor="middle">CHENNAI MARINA BEACH</text>
    <!-- Checkered Finish Flags -->
    <polygon points="120,40 160,55 120,70" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <polygon points="680,40 640,55 680,70" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>